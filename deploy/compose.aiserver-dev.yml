# Fresh engineering environment only; do not combine with ui-acceptance.
name: ais-etl-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: workbench
      POSTGRES_DB: workbench
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [dev-database:/var/lib/postgresql/data]
    networks: [test-only]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workbench -d workbench']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: ais-etl-api:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: api
    environment: &dev-env
      DATABASE_URL: postgresql://workbench@postgres:5432/workbench
      DATABASE_HOST: postgres
      DATABASE_NAME: workbench
      # Public synthetic-only key; no real connection or model secrets here.
      PLATFORM_SETTINGS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WORKBENCH_EXECUTION_ENABLED: 'false'
      WORKBENCH_SA_DISPATCH_ENABLED: 'false'
      WORKBENCH_DEVELOPER_DISPATCH_ENABLED: 'false'
      WORKBENCH_QA_DISPATCH_ENABLED: 'false'
      WORKBENCH_ARTIFACT_ROOT: /app/outputs
    volumes: [dev-artifacts:/app/outputs]
    networks: [test-only]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
  migrate:
    image: ais-etl-api:dev
    environment: *dev-env
    command: [python, -m, app.migrations]
    networks: [test-only]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: ais-etl-web:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ['127.0.0.1:5198:8080']
    networks: [test-only, browser-only]
    depends_on:
      api: {condition: service_healthy}
networks:
  test-only: {internal: true}
  browser-only: {}
volumes:
  dev-database:
  dev-artifacts:
