# Dedicated UI validation: synthetic control DB; no model/Hop/Vertica workers.
name: ai-etl-stage-guidance-ui
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: workbench
      POSTGRES_DB: workbench
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [stage-database:/var/lib/postgresql/data]
    networks: [test-only]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workbench -d workbench']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: ai-etl-workbench-api:stage-guidance
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: api
    environment: &test-env
      DATABASE_URL: postgresql://workbench@postgres:5432/workbench
      DATABASE_HOST: postgres
      DATABASE_NAME: workbench
      PLATFORM_SETTINGS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WORKBENCH_EXECUTION_ENABLED: 'false'
      WORKBENCH_SA_DISPATCH_ENABLED: 'false'
      WORKBENCH_DEVELOPER_DISPATCH_ENABLED: 'false'
      WORKBENCH_QA_DISPATCH_ENABLED: 'false'
      WORKBENCH_ARTIFACT_ROOT: /app/outputs
    volumes: [stage-artifacts:/app/outputs]
    networks: [test-only]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
  migrate:
    image: ai-etl-workbench-api:stage-guidance
    environment: *test-env
    command: [python, -m, app.migrations]
    networks: [test-only]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: ai-etl-workbench-web:stage-guidance
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ['127.0.0.1:5197:8080']
    networks: [test-only, browser-only]
    depends_on:
      api: {condition: service_healthy}
networks:
  test-only: {internal: true}
  browser-only: {}
volumes:
  stage-database:
  stage-artifacts:
